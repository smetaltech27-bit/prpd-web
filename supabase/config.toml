project_id = "prpd-web"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "https://smetaltech27-bit.github.io/prpd-web/"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "https://smetaltech27-bit.github.io/prpd-web/"
]
jwt_expiry = 3600
# Global signup remains enabled so passwordless anonymous Auth sessions can be issued.
# Public email/password registration is disabled separately below.
enable_signup = true
enable_anonymous_sign_ins = true
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"
